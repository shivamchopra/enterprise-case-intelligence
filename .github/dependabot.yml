version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /src/EnterpriseCaseIntelligence.Api
      - /src/EnterpriseCaseIntelligence.Domain
      - /tests/EnterpriseCaseIntelligence.Api.Tests
      - /tests/EnterpriseCaseIntelligence.Domain.Tests
      - /tools/EnterpriseCaseIntelligence.RecordsIntake
      - /tools/EnterpriseCaseIntelligence.ReviewProbe
    schedule:
      interval: weekly
    groups:
      dotnet10-servicing:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore.*"
          - "Microsoft.Data.Sqlite*"
          - "System.Security.Cryptography.Pkcs"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Data.Sqlite*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Security.Cryptography.Pkcs"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
