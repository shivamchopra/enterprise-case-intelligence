version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /src/EnterpriseCaseIntelligence.Api
      - /src/EnterpriseCaseIntelligence.Domain
      - /tests/EnterpriseCaseIntelligence.Api.Tests
      - /tests/EnterpriseCaseIntelligence.Domain.Tests
    schedule:
      interval: weekly
    groups:
      ef-core-sqlite:
        patterns:
          - "Microsoft.EntityFrameworkCore.*"
          - "Microsoft.Data.Sqlite*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
