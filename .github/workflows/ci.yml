name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore EnterpriseCaseIntelligence.slnx
      - name: Restore EF tooling
        run: dotnet tool restore
      - name: Verify formatting
        run: dotnet format EnterpriseCaseIntelligence.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build EnterpriseCaseIntelligence.slnx --configuration Release --no-restore
      - name: Build read-only hosting catalog tool
        run: dotnet build tools/ReviewHostPreflight.cs --configuration Release
      - name: Check undeployed F1 probe envelope offline
        run: dotnet run --file tools/ReviewHostPreflight.cs --configuration Release --no-build -- --proposal infra/review-probe/azuredeploy.json
      - name: Verify EF model snapshot
        run: dotnet ef migrations has-pending-model-changes --project src/EnterpriseCaseIntelligence.Api --configuration Release --no-build
      - name: Publish independent operator probe
        run: dotnet publish tools/EnterpriseCaseIntelligence.ReviewProbe --configuration Release --no-build --no-restore --output "$RUNNER_TEMP/review-probe"
      - name: Test
        env:
          ECI_TEST_PROBE_ASSEMBLY: ${{ runner.temp }}/review-probe/EnterpriseCaseIntelligence.ReviewProbe.dll
        run: dotnet test EnterpriseCaseIntelligence.slnx --configuration Release --no-build --filter 'Category!=Browser'

  browser-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore EnterpriseCaseIntelligence.slnx
      - name: Build browser tests
        run: dotnet build tests/EnterpriseCaseIntelligence.Api.Tests --configuration Release --no-restore
      - name: Publish API
        run: dotnet publish src/EnterpriseCaseIntelligence.Api --configuration Release --no-build --no-restore --output "$RUNNER_TEMP/workspace-api"
      - name: Install Chromium and system dependencies
        run: >-
          dotnet exec --runtimeconfig tests/EnterpriseCaseIntelligence.Api.Tests/bin/Release/net10.0/EnterpriseCaseIntelligence.Api.Tests.runtimeconfig.json
          tests/EnterpriseCaseIntelligence.Api.Tests/bin/Release/net10.0/Microsoft.Playwright.dll install --with-deps chromium
      - name: Test published browser workflow
        env:
          ECI_TEST_API_ASSEMBLY: ${{ runner.temp }}/workspace-api/EnterpriseCaseIntelligence.Api.dll
        run: dotnet test tests/EnterpriseCaseIntelligence.Api.Tests --configuration Release --no-build --filter 'Category=Browser'
